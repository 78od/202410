    <noscript><p class="no-script-note">本站需要启用 JavaScript 才能显示内容。</p></noscript>
    <main id="site-content">
    <div class="container">
      <div class="topbar">
        <div class="brand">欧弟好好读书</div>
        <div class="badge">今日更新：暂停歌词保持位置，播放1.5秒后恢复跟随</div>

      <div class="hero">
        <h1>镇站之宝</h1>
        <div class="sub">精选合集 · 现场热度 · 特色榜单</div>
      </div>

      <div class="feature">
        <div class="card">
          <a class="main-link" href="html/dyh.html" target="_blank">
            <img class="main-image" src="Photos/dyh.png" alt="戴哥" width="520" height="520" fetchpriority="high" decoding="async" />
            <h2>戴哥</h2>
          </a>
        </div>

        <div class="card music-box">
          <div class="album-artwork" aria-hidden="true">
            <div class="album-cover album-cover-says"></div>
            <div class="album-cover album-cover-tears"></div>
            <div class="album-cover album-cover-surprise"></div>
            <div class="album-cover album-cover-future"></div>
            <div class="album-cover album-cover-unfinished"></div>
            <div class="album-cover album-cover-fairy-tale"></div>
            <div class="album-cover album-cover-leaf"></div>
            <div class="album-cover album-cover-freedom"></div>
            <div class="album-cover album-cover-carved"></div>
          </div>
          <div class="player-xiaofu-photo" role="img" aria-label="小夫"></div>
          <div class="album-cover album-cover-lover" aria-hidden="true"></div>
          <h3 class="music-title" id="music-title">正在随机选歌…</h3>
          <audio id="daily-song" controls preload="none"></audio>
          <p class="audio-status" id="audio-status" role="status" aria-live="polite"></p>
          <button class="media-retry-button" id="audio-retry-button" type="button" hidden>重试播放</button>
          <button class="media-retry-button" id="playlist-retry-button" type="button" hidden>重试加载歌曲列表</button>
          <section class="lyrics-panel" aria-label="歌词">
            <p class="lyrics-status" id="lyrics-status" role="status" aria-live="polite">正在载入歌词…</p>
            <button class="media-retry-button" id="lyrics-retry-button" type="button" hidden>重试加载歌词</button>
            <ul class="lyric-lines" id="lyric-lines" aria-label="滚动歌词" hidden></ul>
          </section>
          <div class="song-search">
            <label class="visually-hidden" for="song-search-input">搜索歌曲</label>
            <input id="song-search-input" type="search" placeholder="搜索歌曲名称…" autocomplete="off" disabled />
            <ul class="song-search-results" id="song-search-results" aria-label="搜索结果" hidden></ul>
            <div class="song-search-status" id="song-search-status" role="status" aria-live="polite"></div>
          </div>
          <div class="music-actions">
            <button class="random-song-button" id="random-song-button" type="button" disabled>随机换一首</button>
            <button class="loop-song-button" id="loop-song-button" type="button" aria-pressed="false">单曲循环：关</button>
            <button class="favorite-song-button" id="favorite-song-button" type="button" aria-pressed="false" disabled>☆ 收藏</button>
            <button class="favorites-toggle-button" id="favorites-toggle-button" type="button" aria-expanded="false" aria-controls="favorite-song-list" disabled>我的收藏</button>
          </div>
          <ul class="favorite-song-list" id="favorite-song-list" aria-label="我的收藏" hidden></ul>
          <div class="favorite-song-status" id="favorite-song-status" role="status" aria-live="polite"></div>
          <div class="music-tip">欧弟爱听，没办法</div>
          <a class="standalone-player-link" href="html/player.html" target="_blank">打开独立播放器</a>
        </div>

            <li><a href="html/NO.jp.html" target="_blank">进入榜单</a></li>
          </ul>

        <img src="Photos/pochacco-pet.png" alt="" width="707" height="759" decoding="async" />

    </div>
