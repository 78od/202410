<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>最极品名媛：戴益航 价格表</title>
    <style>
      :root {
        --bg: #090909;
        --panel: rgba(20, 20, 20, 0.96);
        --line: rgba(255, 255, 255, 0.1);
        --text: #f3f3f3;
        --muted: #c9c9c9;
        --accent: #5aa9ff;
        --gold: #f4c95d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #202020 0%, #0b0b0b 45%, #050505 100%);
        color: var(--text);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px 18px 48px;
      }

      .back-btn {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 18px;
        background: rgba(90, 169, 255, 0.12);
        border: 1px solid rgba(90, 169, 255, 0.7);
        border-radius: 999px;
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .back-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(90, 169, 255, 0.2);
      }

      .card {
        background: linear-gradient(180deg, rgba(22, 22, 22, 0.96), rgba(12, 12, 12, 0.96));
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        padding: 28px 18px;
      }

      h1 {
        margin: 0 0 18px;
        text-align: center;
        font-size: clamp(2rem, 4vw, 4.2rem);
      }

      .old {
        color: var(--muted);
        text-decoration: line-through;
      }

      .new {
        color: var(--gold);
      }

      img {
        display: block;
        width: min(100%, 520px);
        margin: 22px auto 0;
        border-radius: 15px;
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a href="../index.html" class="back-btn">← 返回上一级</a>
      <div class="card">
        <h1 class="old">原价：91元/小时</h1>
        <h1 class="new">现价：78元/小时!!!</h1>
        <img src="/202410/Photos/dyh1.jpg" alt="戴益航价格图" />
      </div>
    </div>
  </body>
</html>
