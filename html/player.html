<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../Photos/小夫.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="../css/style.css?v=pet-headphones-20261115" />
    <link rel="preload" as="image" href="../music/mp/player-artwork.jpg?v=33ae63707a42" fetchpriority="high" />
    <title>音乐播放器</title>
  </head>
  <body class="player-page">
    <noscript><p class="no-script-note">本站需要启用 JavaScript 才能显示内容。</p></noscript>
    <main class="wrap">
      <h1 class="standalone-player-heading">音乐播放器</h1>
      <section class="card music-box standalone-player" aria-label="音乐播放器">
        <div class="album-artwork" aria-hidden="true">
          <div class="album-cover album-cover-says"></div>
          <div class="album-cover album-cover-tears"></div>
          <div class="album-cover album-cover-surprise"></div>
          <div class="album-cover album-cover-future"></div>
          <div class="album-cover album-cover-unfinished"></div>
          <div class="album-cover album-cover-fairy-tale"></div>
          <div class="album-cover album-cover-leaf"></div>
          <div class="album-cover album-cover-freedom"></div>
          <div class="album-cover album-cover-carved"></div>
        </div>
        <div class="album-cover album-cover-guitarist" aria-hidden="true"></div>
        <div class="player-xiaofu-photo" role="img" aria-label="小夫"></div>
        <div class="album-cover album-cover-lover" aria-hidden="true"></div>
        <h2 class="music-title" id="music-title">正在随机选歌…</h2>
        <audio id="daily-song" controls preload="none"></audio>
        <p class="audio-status" id="audio-status" role="status" aria-live="polite"></p>
        <button class="media-retry-button" id="audio-retry-button" type="button" hidden>重试播放</button>
        <button class="media-retry-button" id="playlist-retry-button" type="button" hidden>重试加载歌曲列表</button>
        <section class="lyrics-panel" aria-label="歌词">
          <p class="lyrics-status" id="lyrics-status" role="status" aria-live="polite">正在载入歌词…</p>
          <button class="media-retry-button" id="lyrics-retry-button" type="button" hidden>重试加载歌词</button>
          <ul class="lyric-lines" id="lyric-lines" aria-label="滚动歌词" hidden></ul>
        </section>
        <div class="song-search">
          <label class="visually-hidden" for="song-search-input">搜索歌曲</label>
          <input id="song-search-input" type="search" placeholder="搜索歌曲名称…" autocomplete="off" disabled />
          <ul class="song-search-results" id="song-search-results" aria-label="搜索结果" hidden></ul>
          <div class="song-search-status" id="song-search-status" role="status" aria-live="polite"></div>
        </div>
        <div class="music-actions">
          <button class="random-song-button" id="random-song-button" type="button" disabled>随机换一首</button>
          <button class="loop-song-button" id="loop-song-button" type="button" aria-pressed="false">单曲循环：关</button>
          <button class="favorite-song-button" id="favorite-song-button" type="button" aria-pressed="false" disabled>☆ 收藏</button>
          <button class="favorites-toggle-button" id="favorites-toggle-button" type="button" aria-expanded="false" aria-controls="favorite-song-list" disabled>我的收藏</button>
        </div>
        <ul class="favorite-song-list" id="favorite-song-list" aria-label="我的收藏" hidden></ul>
        <div class="favorite-song-status" id="favorite-song-status" role="status" aria-live="polite"></div>
        <p class="music-tip">搜索歌名，或随机切换一首</p>
      </section>

            <div class="site-pet" id="site-pet">
        <button class="site-pet-button" id="site-pet-button" type="button" aria-label="拖动小狗，或点击让它做个动作">
          <span class="site-pet-visual">
            <img src="../Photos/pochacco-pet.png" alt="" width="707" height="759" draggable="false" decoding="async" />
            <span class="site-pet-eyes" aria-hidden="true">
              <span class="site-pet-eye site-pet-eye-left"></span>
              <span class="site-pet-eye site-pet-eye-right"></span>
            </span>
            <span class="site-pet-phones" aria-hidden="true">
              <svg viewBox="0 0 707 759" focusable="false" role="presentation">
                <defs>
                  <linearGradient id="site-pet-band-blue" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#a8dcff" />
                    <stop offset=".5" stop-color="#5aa9ff" />
                    <stop offset="1" stop-color="#2f7fd4" />
                  </linearGradient>
                  <linearGradient id="site-pet-cup-blue" x1=".1" y1="0" x2=".95" y2="1">
                    <stop offset="0" stop-color="#b7e2ff" />
                    <stop offset=".45" stop-color="#5aa9ff" />
                    <stop offset="1" stop-color="#2769b8" />
                  </linearGradient>
                </defs>
                <path d="M146 330 C 148 180 244 128 350 128 C 456 128 552 188 552 318"
                  fill="none" stroke="#1b2a3a" stroke-width="44" stroke-linecap="round" />
                <path d="M146 330 C 148 180 244 128 350 128 C 456 128 552 188 552 318"
                  fill="none" stroke="url(#site-pet-band-blue)" stroke-width="31" stroke-linecap="round" />
                <g transform="translate(134 342) rotate(-9)">
                  <ellipse cx="0" cy="4" rx="73" ry="87" fill="#1b2a3a" />
                  <ellipse cx="0" cy="0" rx="64" ry="78" fill="#eef5fc" />
                  <ellipse cx="0" cy="0" rx="51" ry="65" fill="url(#site-pet-cup-blue)" />
                  <ellipse cx="-13" cy="-19" rx="21" ry="29" fill="#fff" opacity=".24" />
                  <g transform="translate(0 4)" fill="#f4c95d">
                    <ellipse cx="0" cy="10" rx="14" ry="11" />
                    <circle cx="-15" cy="-5" r="6" />
                    <circle cx="0" cy="-11" r="6" />
                    <circle cx="15" cy="-5" r="6" />
                  </g>
                </g>
                <g transform="translate(568 328) rotate(9)">
                  <ellipse cx="0" cy="4" rx="73" ry="87" fill="#1b2a3a" />
                  <ellipse cx="0" cy="0" rx="64" ry="78" fill="#eef5fc" />
                  <ellipse cx="0" cy="0" rx="51" ry="65" fill="url(#site-pet-cup-blue)" />
                  <ellipse cx="-13" cy="-19" rx="21" ry="29" fill="#fff" opacity=".24" />
                  <g transform="translate(0 4)" fill="#f4c95d">
                    <ellipse cx="0" cy="10" rx="14" ry="11" />
                    <circle cx="-15" cy="-5" r="6" />
                    <circle cx="0" cy="-11" r="6" />
                    <circle cx="15" cy="-5" r="6" />
                  </g>
                </g>
              </svg>
            </span>
          </span>
        </button>
      </div>
    </main>
    <script src="../js/daily-music.js?v=a1d5a034223d" defer></script>
    <script src="../js/image-viewer.js?v=44e61b25f920" defer></script>
    <script src="../js/site-pet.js?v=site-pet-headphones-20261115" defer></script>
  </body>
</html>
