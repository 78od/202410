<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css?v=20261101-4" />
    <title>音乐播放器</title>
  </head>
  <body class="player-page">
    <main class="wrap">
      <h1 class="standalone-player-heading">音乐播放器</h1>
      <section class="card music-box standalone-player" aria-label="音乐播放器">
        <img class="rotate" src="/202410/Photos/小夫.jpg" alt="专辑封面" />
        <h2 class="music-title" id="music-title">正在载入今日歌曲…</h2>
        <audio id="daily-song" controls preload="none"></audio>
        <section class="lyrics-panel" aria-label="歌词">
          <p class="lyrics-status" id="lyrics-status" role="status" aria-live="polite">正在载入歌词…</p>
          <ul class="lyric-lines" id="lyric-lines" aria-label="滚动歌词" hidden></ul>
        </section>
        <div class="song-search">
          <label class="visually-hidden" for="song-search-input">搜索歌曲</label>
          <input id="song-search-input" type="search" placeholder="搜索歌曲名称…" autocomplete="off" disabled />
          <ul class="song-search-results" id="song-search-results" aria-label="搜索结果" hidden></ul>
          <div class="song-search-status" id="song-search-status" role="status" aria-live="polite"></div>
        </div>
        <div class="music-actions">
          <button class="random-song-button" id="random-song-button" type="button" disabled>随机换一首</button>
          <button class="favorite-song-button" id="favorite-song-button" type="button" aria-pressed="false" disabled>☆ 收藏</button>
          <button class="favorites-toggle-button" id="favorites-toggle-button" type="button" aria-expanded="false" aria-controls="favorite-song-list" disabled>我的收藏</button>
        </div>
        <ul class="favorite-song-list" id="favorite-song-list" aria-label="我的收藏" hidden></ul>
        <div class="favorite-song-status" id="favorite-song-status" role="status" aria-live="polite"></div>
        <p class="music-tip">搜索歌名，或随机切换一首</p>
      </section>
    </main>
    <script src="../js/daily-music.js?v=20261101-7" defer></script>
  </body>
</html>
