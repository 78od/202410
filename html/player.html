<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css?v=23d4643190ed" />
    <link rel="preload" as="image" href="../music/mp/第二天堂(江南)-600.jpg" fetchpriority="high" />
    <title>音乐播放器</title>
  </head>
  <body class="player-page">
    <main class="wrap">
      <h1 class="standalone-player-heading">音乐播放器</h1>
      <section class="card music-box standalone-player" aria-label="音乐播放器">
        <div class="album-artwork" aria-hidden="true">
          <img class="album-cover album-cover-says" src="../music/mp/她说.jpg" alt="" loading="eager" fetchpriority="high" decoding="async" draggable="false" />
          <img class="album-cover album-cover-tears" src="../music/mp/别再为他流泪-600.jpg" alt="" loading="lazy" fetchpriority="low" decoding="async" draggable="false" />
          <img class="album-cover album-cover-surprise" src="../music/mp/意外-600.jpg" alt="" loading="lazy" fetchpriority="low" decoding="async" draggable="false" />
          <img class="album-cover album-cover-future" src="../music/mp/未來-600.jpg" alt="" loading="lazy" fetchpriority="low" decoding="async" draggable="false" />
          <img class="album-cover album-cover-unfinished" src="../music/mp/未完成-600.jpg" alt="" loading="lazy" fetchpriority="low" decoding="async" draggable="false" />
          <img class="album-cover album-cover-fairy-tale" src="../music/mp/童話-600.jpg" alt="" loading="lazy" fetchpriority="low" decoding="async" draggable="false" />
          <img class="album-cover album-cover-leaf" src="../music/mp/葉惠美-600.jpg" alt="" loading="lazy" fetchpriority="low" decoding="async" draggable="false" />
          <img class="album-cover album-cover-freedom" src="../music/mp/自由的你-Single-600.jpg" alt="" loading="lazy" fetchpriority="low" decoding="async" draggable="false" />
        </div>
        <img class="player-xiaofu-photo" src="../Photos/小夫.jpg" alt="小夫" loading="eager" decoding="async" draggable="false" />
        <img class="album-cover album-cover-lover" src="../music/mp/戀人-Single-600.jpg" alt="" loading="lazy" fetchpriority="low" decoding="async" draggable="false" />
        <h2 class="music-title" id="music-title">正在随机选歌…</h2>
        <audio id="daily-song" controls preload="none"></audio>
        <p class="audio-status" id="audio-status" role="status" aria-live="polite"></p>
        <button class="media-retry-button" id="audio-retry-button" type="button" hidden>重试播放</button>
        <button class="media-retry-button" id="playlist-retry-button" type="button" hidden>重试加载歌曲列表</button>
        <section class="lyrics-panel" aria-label="歌词">
          <p class="lyrics-status" id="lyrics-status" role="status" aria-live="polite">正在载入歌词…</p>
          <button class="media-retry-button" id="lyrics-retry-button" type="button" hidden>重试加载歌词</button>
          <ul class="lyric-lines" id="lyric-lines" aria-label="滚动歌词" hidden></ul>
        </section>
        <div class="song-search">
          <label class="visually-hidden" for="song-search-input">搜索歌曲</label>
          <input id="song-search-input" type="search" placeholder="搜索歌曲名称…" autocomplete="off" disabled />
          <ul class="song-search-results" id="song-search-results" aria-label="搜索结果" hidden></ul>
          <div class="song-search-status" id="song-search-status" role="status" aria-live="polite"></div>
        </div>
        <div class="music-actions">
          <button class="random-song-button" id="random-song-button" type="button" disabled>随机换一首</button>
          <button class="loop-song-button" id="loop-song-button" type="button" aria-pressed="false">单曲循环：关</button>
          <button class="favorite-song-button" id="favorite-song-button" type="button" aria-pressed="false" disabled>☆ 收藏</button>
          <button class="favorites-toggle-button" id="favorites-toggle-button" type="button" aria-expanded="false" aria-controls="favorite-song-list" disabled>我的收藏</button>
        </div>
        <ul class="favorite-song-list" id="favorite-song-list" aria-label="我的收藏" hidden></ul>
        <div class="favorite-song-status" id="favorite-song-status" role="status" aria-live="polite"></div>
        <p class="music-tip">搜索歌名，或随机切换一首</p>
      </section>
    </main>
    <script src="../js/daily-music.js?v=13dc7ccb88c7" defer></script>
    <script src="../js/image-viewer.js?v=054d84bcccdb" defer></script>
  </body>
</html>
