<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>最嘉豪名媛：郭泽豪 简介</title>
    <style>
      :root {
        --bg: #090909;
        --panel: rgba(20, 20, 20, 0.96);
        --line: rgba(255, 255, 255, 0.1);
        --text: #f3f3f3;
        --gold: #f4c95d;
        --accent: #5aa9ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1d1d1d 0%, #0c0c0c 55%, #040404 100%);
        color: var(--text);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px 18px 48px;
      }

      .back-btn {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 18px;
        background: rgba(90, 169, 255, 0.12);
        border: 1px solid rgba(90, 169, 255, 0.7);
        border-radius: 999px;
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }

      .card {
        background: linear-gradient(180deg, rgba(22, 22, 22, 0.96), rgba(12, 12, 12, 0.96));
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        padding: 28px 18px;
      }

      h1 {
        margin: 0 0 18px;
        text-align: center;
        font-size: clamp(1.8rem, 3vw, 3.2rem);
      }

      .warning {
        color: var(--gold);
      }

      img {
        display: block;
        width: min(100%, 520px);
        margin: 22px auto;
        min-height: 220px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a href="../index.html" class="back-btn">← 返回上一级</a>
      <div class="card">
        <h1>老班长走后最豪之人</h1>
        <h1>上课永远不会睡觉</h1>
        <h1>华莱士99.99%股份拥有者</h1>
        <img src="" alt="等待补充图片" />
        <h1 class="warning">急需图片和文案提供！！！</h1>
      </div>
    </div>
  </body>
</html>
